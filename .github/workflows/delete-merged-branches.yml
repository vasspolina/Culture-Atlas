# One-off: deletes the branches listed in .github/branch-cleanup/branches.txt, whose work is already in main
# (merged, or squash-merged through a merged PR). Each line is "<branch> <commit it pointed at when checked>".
# A branch is skipped if it has moved since that check, has an open pull request, or is main or gh-pages.
# Removed again right after it runs.
name: Delete merged branches (one-off)

on:
  push:
    branches: [claude/sweet-ritchie-uxvj36]
    paths: ['.github/branch-cleanup/branches.txt']

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the listed branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          deleted=0; skipped=0; gone=0
          while read -r b sha; do
            [ -z "$b" ] && continue
            case "$b" in main|gh-pages|"$GITHUB_REF_NAME") echo "SKIP protected $b"; skipped=$((skipped+1)); continue;; esac
            enc=$(jq -rn --arg s "$b" '$s|@uri')
            now=$(gh api "repos/$REPO/git/ref/heads/$b" --jq .object.sha 2>/dev/null || true)
            if [ -z "$now" ]; then echo "GONE $b"; gone=$((gone+1)); continue; fi
            if [ "$now" != "$sha" ]; then echo "SKIP moved $b ($sha -> $now)"; skipped=$((skipped+1)); continue; fi
            open=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$enc" --jq length)
            if [ "$open" != "0" ]; then echo "SKIP open-pr $b"; skipped=$((skipped+1)); continue; fi
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$enc" >/dev/null; then echo "DELETED $b"; deleted=$((deleted+1));
            else echo "FAILED $b"; skipped=$((skipped+1)); fi
          done < .github/branch-cleanup/branches.txt
          echo "deleted=$deleted skipped=$skipped already_gone=$gone" | tee -a "$GITHUB_STEP_SUMMARY"
